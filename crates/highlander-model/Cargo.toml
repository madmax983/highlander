[package]
name = "highlander-model"
version = "0.1.0"
description = "Rung 1: a verified checkpoint storage model — commit/recover over an abstract cell model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vstd.workspace = true

[features]
default = []
# The falsifiability gate (design doc §7.3). Removes the barrier from
# `commit_program`, which MUST make `theorem::crash_consistency` fail to verify.
# Never enable this outside scripts/gate.sh.
no-barrier = []
# The second falsifiability gate. Replaces `recover` with a version that keeps the
# seal and discards every payload cell, which MUST make `commit::commit_is_durable`
# fail to verify. Crash consistency alone does not catch this: a checkpoint that
# forgets everything never tears. Never enable this outside scripts/gate.sh.
degenerate-recover = []
# The third falsifiability gate. Removes the copy from copy-on-write, so a write
# during a checkpoint overwrites the page the writer has not collected yet. This
# MUST make `cow::mutate_preserves_inv` fail to verify. Never enable this outside
# scripts/gate.sh.
no-cow-copy = []

[package.metadata.verus]
verify = true

[lints]
workspace = true

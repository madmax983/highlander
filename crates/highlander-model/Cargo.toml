[package]
name = "highlander-model"
version = "0.1.0"
description = "Rung 1: a verified checkpoint storage model — commit/recover over an abstract cell model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vstd.workspace = true

[features]
default = []
# The falsifiability gate (design doc §7.3). Removes the barrier from
# `commit_program`, which MUST make `theorem::crash_consistency` fail to verify.
# Never enable this outside scripts/gate.sh.
no-barrier = []
# The second falsifiability gate. Replaces `recover` with a version that keeps the
# seal and discards every payload cell, which MUST make `commit::commit_is_durable`
# fail to verify. Crash consistency alone does not catch this: a checkpoint that
# forgets everything never tears. Never enable this outside scripts/gate.sh.
degenerate-recover = []
# The third falsifiability gate. Removes the copy from copy-on-write, so a write
# during a checkpoint overwrites the page the writer has not collected yet. This
# MUST make `cow::mutate_preserves_inv` fail to verify. Never enable this outside
# scripts/gate.sh.
no-cow-copy = []
# The fourth falsifiability gate. Drops the requirement that the register file and
# memory occupy different cells, so a capture writes both to one cell and loses one
# of them. This MUST make `machine::capture_restore_roundtrip` fail to verify.
# Never enable this outside scripts/gate.sh.
overlapping-layout = []
# The fifth falsifiability gate. Drops the requirement that a replay receives the
# inputs it received before the crash. This MUST make
# `process::replay_follows_the_same_trajectory` fail to verify. Never enable this
# outside scripts/gate.sh.
ignore-input-journal = []
# The sixth falsifiability gate. Makes the I/O boundary accept every event, so the
# window repeated after a crash reaches the world twice. This MUST make
# `io::a_repeated_window_is_delivered_once` fail to verify. Never enable this
# outside scripts/gate.sh.
no-output-dedup = []
# The seventh falsifiability gate. Drops A1, so a cell may be wider than the atomic
# write unit and a crash may leave it holding a mixture. This MUST make
# `refine::refinement_under_a1` fail to verify. Never enable this outside
# scripts/gate.sh.
multi-byte-cells = []

[package.metadata.verus]
verify = true

[lints]
workspace = true

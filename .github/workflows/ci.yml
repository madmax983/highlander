name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the vstd pin in Cargo.toml; scripts/verify.sh enforces it.
  VERUS_RELEASE: "0.2026.08.23.fbbbbcf"

jobs:
  # Everything that needs only a stock toolchain.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      # Includes the negative test: without a barrier, the property must be false.
      - run: cargo test --workspace

  # The proof, and the gate that keeps it honest.
  verus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install Verus
        run: |
          set -euo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          curl -fsSL -o verus.zip "$url"
          unzip -q verus.zip
          echo "$PWD/verus-x86-linux" >> "$GITHUB_PATH"
      - run: verus --version
      - name: Verify the proof
        run: ./scripts/verify.sh
      # Two negative tests, both of which must FAIL to verify, each on its named
      # lemma and as a postcondition failure rather than a compile error:
      #   no-barrier         -> commit_establishes_shape  (A2 gives 2 epochs)
      #   degenerate-recover -> commit_is_durable         (a checkpoint keeps data)
      # See docs/design/0002-what-was-proven.md §4 and §5b.
      - name: Falsifiability gates
        run: ./scripts/gate.sh
